[project]
name = "reserva"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx2",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "locust>=2.46.6",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
markers = ["requisito(id): el requisito que esta prueba comprueba"]
